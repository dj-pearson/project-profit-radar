name = "brikly"
compatibility_date = "2024-07-01"
pages_build_output_dir = "dist"

# Non-secret structural build config only.
#
# Environment-specific runtime config (the Supabase anon/publishable key and all
# Stripe price/product IDs) is intentionally NOT committed here. It is injected
# per environment via the Cloudflare Pages dashboard (Production and Preview),
# so keys can be rotated and IDs swapped without a source change and so a prod
# build can never accidentally ship staging/test values.
#
# Required per-environment variables are documented in docs/DEPLOYMENT_ENV.md.
# The production build fails fast (see vite.config.ts) if a required public var
# is missing, so a misconfigured environment is caught at build time.
#
# NOTE: [vars] here would OVERRIDE the Cloudflare dashboard values, so we keep
# only the stable public endpoints below. Do not add keys or price IDs.
[vars]
VITE_SUPABASE_URL = "https://api.brikly.net"
VITE_EDGE_FUNCTIONS_URL = "https://functions.brikly.net"