name: Performance Budget Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  bundle-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build
        run: npx vite build
        env:
          # vite.config.ts refuses to build without these (the deploy guard).
          # Placeholders are enough to measure bundle size; same values the
          # Lighthouse workflow uses.
          VITE_SUPABASE_URL: https://api.brikly.net
          VITE_SUPABASE_PUBLISHABLE_KEY: bundle-budget-placeholder
          VITE_EDGE_FUNCTIONS_URL: https://functions.brikly.net

      - name: Check bundle size
        run: node scripts/check-bundle-budget.mjs

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: dist/assets/
          retention-days: 7
