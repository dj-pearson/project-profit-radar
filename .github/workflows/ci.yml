name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # The branches filter matches the BASE branch. release/** is here because
    # US-213 makes CI a required check on that ruleset, and a required check
    # that never runs blocks every merge into the branch. hotfix/** takes
    # direct commits by design (CLAUDE.md), so its gate is the PR into main,
    # which is already covered by the main entry.
    branches: [main, develop, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      # US-400: one eslint run that fails on any error AND holds the warning
      # count exactly at .github/eslint-warning-baseline.txt, so the warning
      # backlog ratchets down instead of drifting up. Same scope as `npm run lint`.
      - run: node scripts/check-eslint-warnings.mjs

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      # US-258: error-budget ratchet, not a raw `tsc` (which is red until US-212
      # lands). Fails only on regressions above .github/ts-error-baseline.txt.
      - run: node scripts/check-ts-error-budget.mjs

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      # US-215: one run that is both the test suite and the coverage gate.
      # test:coverage is `vitest run --coverage`, so every test still runs and
      # a failing test still fails the job; on top of that, coverage below the
      # ratchet in vitest.config.ts (coverage.thresholds) fails it too. The
      # axe suites (src/pages/__tests__/*.a11y.test.tsx) run here as ordinary
      # tests, so an a11y regression they cover fails this job.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - run: npm run build
        env:
          # vite.config.ts fails a production build that has no
          # VITE_SUPABASE_PUBLISHABLE_KEY. That guard belongs to the DEPLOY -
          # Cloudflare Pages, which has the real value per environment - but it
          # also ran here, where CI is only proving the tree compiles, and it
          # had failed this job on every push to main since 2026-08-13. E2E
          # depends on this job, so both were dead from one missing variable.
          # A placeholder satisfies the guard without weakening it: a deploy
          # missing the real key still fails, in the place that can tell.
          VITE_SUPABASE_URL: https://ci.placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key
          # When these secrets are configured, the build emits hidden
          # sourcemaps and uploads them to Sentry, then deletes the .map files
          # from dist so they are not served publicly. Unset => plugin no-ops.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_APP_VERSION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    # No `needs: build` (US-409). That dependency is how this suite went dark
    # for a month: build failed from 2026-08-13, so E2E was SKIPPED on every
    # push rather than failing. This job builds for itself below, so a broken
    # build now turns it red instead of switching it off.
    env:
      # Job-level so the build and the test step agree: the Supabase target is
      # baked into dist/ at build time, and tests/e2e/global-setup.ts checks
      # the same value before anything runs. Without these the app falls back
      # to https://api.brikly.net - src/integrations/supabase/client.ts
      # defaults to PRODUCTION when VITE_SUPABASE_URL is unset - and
      # global-setup refuses to start. A placeholder, or a staging project if
      # E2E_SUPABASE_URL is ever configured; never production (global-setup
      # rejects the production hosts by name).
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || 'e2e-placeholder-no-backend' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - run: npx playwright install chromium --with-deps
      # The suite runs against the production build served by `vite preview`
      # (E2E_SERVE=build in playwright.config.ts), not the dev server: that is
      # what ships, and the two timing assertions only mean something there.
      # It is built here rather than taken from the build job's artifact
      # because that artifact bakes in the build job's placeholder URL, and a
      # staging E2E_SUPABASE_URL has to be compiled in to take effect.
      # PRERENDER=0: the E2E suite drives the app, not crawler HTML (US-222).
      - run: npm run build
        env:
          PRERENDER: '0'
      # US-214 AC3: Mobile Chrome as well as desktop. playwright.config.ts has
      # defined Mobile Chrome (Pixel 5) and Mobile Safari (iPhone 12) since it
      # was written, and CI ran neither - so every responsive assertion in the
      # suite was dead weight. Mobile Chrome uses the same chromium binary
      # installed above, so this costs a second project run and no extra
      # download; Mobile Safari would need webkit and is left out on purpose.
      - run: npx playwright test --project=chromium --project="Mobile Chrome"
        env:
          CI: true
          E2E_SERVE: build
          # Set these only against a backend that is NOT production: the auth
          # specs sign in for real. Unset, they skip with a stated reason
          # (tests/e2e/fixtures/auth.ts) rather than silently passing.
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security:
    name: Security Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Run security unit tests
        run: npm run test:security

      # Tenancy isolation against a real Postgres (US-343, US-394). The runner
      # image ships the PostgreSQL server binaries; the script finds them.
      - name: RLS tenancy tests
        run: npm run test:rls

      - name: Secret scanning
        run: bash scripts/secret-scan.sh

      - name: Verify CSP does not contain unsafe-eval
        run: |
          if grep -q "unsafe-eval" public/_headers; then
            echo "::error::CSP in public/_headers contains 'unsafe-eval'. This is a security risk."
            exit 1
          else
            echo "CSP check passed: no unsafe-eval found."
          fi

      - name: Edge function auth guard (US-198)
        run: node scripts/check-edge-function-auth.mjs

      - name: Wildcard-CORS guard (US-240)
        run: node scripts/check-cors-wildcards.mjs

      - name: Edge-function input-validation guard (US-241)
        run: node scripts/check-edge-input-validation.mjs

      - name: Edge-function response-envelope guard (US-274)
        run: node scripts/check-response-envelope.mjs

      - name: Edge-function privilege-write guard (US-297)
        run: node scripts/check-edge-privilege-writes.mjs

      - name: RLS write-path guard (US-237)
        run: node scripts/check-rls-write-paths.mjs

      - name: Audit-trail coverage guard (US-244)
        run: node scripts/check-audit-coverage.mjs

      - name: Edge-function error-reporting guard (US-251)
        run: node scripts/check-edge-error-reporting.mjs

      - name: Silent-write guard
        run: node scripts/check-silent-writes.mjs

      - name: Ruleset/workflow consistency guard (US-213)
        run: node scripts/check-ruleset-consistency.mjs

      - name: Node version pins agree (US-389)
        run: node scripts/check-node-version-pins.mjs

      - name: Environment names documented (US-392)
        run: node scripts/check-edge-secrets.mjs

      - name: No source file hidden by .gitignore (US-402)
        run: node scripts/check-ignored-source-files.mjs

      - name: CSP inline-script hash guard (US-202)
        run: node scripts/check-csp-hashes.mjs

      - name: Rate-limit coverage guard (US-243)
        run: node scripts/check-rate-limit-coverage.mjs

      - name: Sanitizer test-env guard (US-304)
        run: node scripts/check-sanitizer-test-env.mjs

      - name: Unreferenced security-module guard (US-302)
        run: node scripts/check-unreferenced-security-modules.mjs

      - name: Insecure-random guard (US-296)
        run: node scripts/check-insecure-random.mjs

      - name: Anonymous-write guard (US-241 follow-up)
        run: node scripts/check-anonymous-writes.mjs

      - name: Unauthenticated edge-function guard (US-241)
        run: node scripts/check-unauthenticated-edge-functions.mjs

      - name: SECURITY DEFINER search_path guard (US-353)
        run: node scripts/check-definer-search-path.mjs

      - name: Fake-success guard (US-309)
        run: node scripts/check-fake-success.mjs

      - name: Fabricated-fallback guard (US-403)
        run: node scripts/check-fabricated-fallbacks.mjs

      - name: No migration-repair in a deploy path (US-248)
        run: bash scripts/check-no-migration-repair.sh

      - name: RPC-definition guard (US-303)
        run: node scripts/check-rpc-definitions.mjs

      - name: supabase.raw() guard (US-300)
        run: node scripts/check-supabase-raw.mjs

      - name: Deno import-pinning guard (US-272)
        run: node scripts/check-deno-imports.mjs

      - name: Table-definition guard (US-311)
        run: node scripts/check-table-definitions.mjs
      - name: Customer-link guard (US-326)
        run: node scripts/check-customer-links.mjs

      - name: Tier definition is generated, not copied (US-335)
        run: node scripts/generate-tiers.mjs --check

      - name: PostgREST embeds name a real foreign key (US-336)
        run: node scripts/check-embed-constraints.mjs

      - name: Dead-link guard (US-312)
        run: node scripts/check-dead-links.mjs

      - name: Param-route trap guard (US-312 follow-up)
        run: node scripts/check-param-route-traps.mjs

      - name: Orphan-route guard (US-315)
        run: node scripts/check-orphan-routes.mjs

      - name: Live-schema table guard (US-311 follow-up)
        run: node scripts/check-live-schema-tables.mjs

      - name: Generated Supabase types guard (US-263)
        run: node scripts/check-generated-types.mjs

      - name: God-file guard (US-267)
        run: node scripts/check-god-files.mjs

      - name: Direct-formatting guard (US-377)
        run: node scripts/check-direct-formatting.mjs

      - name: Ad-hoc loader guard (US-285)
        run: node scripts/check-adhoc-loaders.mjs

      - name: Accessible page wrapper guard (US-221)
        run: node scripts/count-a11y-adoption.mjs --check

      - name: Raw supabase.from() in components guard (US-266)
        run: node scripts/check-raw-supabase-in-components.mjs

      - name: Raw-state form guard (US-268)
        run: node scripts/check-form-validation.mjs


      - name: Unreferenced-module guard (US-314 follow-up)
        run: node scripts/check-unreferenced-modules.mjs

      - name: Unreferenced-component guard (US-314)
        run: node scripts/check-unreferenced-components.mjs

      - name: Migration filename guard (US-235)
        run: bash scripts/check-migration-filenames.sh

      - name: No stray edge-function backup copies (US-239)
        run: bash scripts/check-no-stray-function-copies.sh

      - name: RLS permissive-policy guard (US-237)
        run: node scripts/check-rls-policies.mjs

      - name: No tracked build/backup/env cruft (US-261)
        run: bash scripts/check-no-tracked-cruft.sh

      - name: Repo root allowlist + no SQL outside supabase/ (US-396)
        run: node scripts/check-root-files.mjs

      - name: Migration backward-compat guard (US-250)
        run: node scripts/check-migration-backcompat.mjs

      - name: Index CONCURRENTLY guard (US-249)
        run: node scripts/check-index-concurrently.mjs

      # Last on purpose. A failing step skips every step after it, and this one
      # sat at position 6 with 44 guards behind it - so a single unfixed CVE
      # silently disabled the entire guard suite while the job still reported
      # as "completed". That is how the storage-privacy and node-pin guards
      # were registered but never actually ran. Keep this at the end: it still
      # fails the job, it just no longer takes the guards down with it.
      - name: Dependency vulnerability audit
        # US-255: blocks on high/critical CVEs. Pre-existing backlog is
        # suppressed via scripts/audit-allowlist.json (with expiry); new
        # high/critical advisories fail the job.
        run: npm run security:audit
