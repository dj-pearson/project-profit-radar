name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # The branches filter matches the BASE branch. release/** is here because
    # US-213 makes CI a required check on that ruleset, and a required check
    # that never runs blocks every merge into the branch. hotfix/** takes
    # direct commits by design (CLAUDE.md), so its gate is the PR into main,
    # which is already covered by the main entry.
    branches: [main, develop, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      # US-258: error-budget ratchet, not a raw `tsc` (which is red until US-212
      # lands). Fails only on regressions above .github/ts-error-baseline.txt.
      - run: node scripts/check-ts-error-budget.mjs

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - run: npm run build
        env:
          # When these secrets are configured, the build emits hidden
          # sourcemaps and uploads them to Sentry, then deletes the .map files
          # from dist so they are not served publicly. Unset => plugin no-ops.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          VITE_APP_VERSION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - run: npx playwright install chromium --with-deps
      # US-258: no `npm run build` here — the e2e webServer runs the Vite dev
      # server (npm run dev:ci), so dist/ is unused, and the production build is
      # already verified by the `build` job (needs: build above).
      - run: npx playwright test --project=chromium
        env:
          CI: true

  security:
    name: Security Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Run security unit tests
        run: npm run test:security

      - name: Dependency vulnerability audit
        # US-255: blocks on high/critical CVEs. Pre-existing backlog is
        # suppressed via scripts/audit-allowlist.json (with expiry); new
        # high/critical advisories fail the job.
        run: npm run security:audit

      - name: Secret scanning
        run: bash scripts/secret-scan.sh

      - name: Verify CSP does not contain unsafe-eval
        run: |
          if grep -q "unsafe-eval" public/_headers; then
            echo "::error::CSP in public/_headers contains 'unsafe-eval'. This is a security risk."
            exit 1
          else
            echo "CSP check passed: no unsafe-eval found."
          fi

      - name: Edge function auth guard (US-198)
        run: node scripts/check-edge-function-auth.mjs

      - name: Wildcard-CORS guard (US-240)
        run: node scripts/check-cors-wildcards.mjs

      - name: Edge-function input-validation guard (US-241)
        run: node scripts/check-edge-input-validation.mjs

      - name: Edge-function privilege-write guard (US-297)
        run: node scripts/check-edge-privilege-writes.mjs

      - name: RLS write-path guard (US-237)
        run: node scripts/check-rls-write-paths.mjs

      - name: Audit-trail coverage guard (US-244)
        run: node scripts/check-audit-coverage.mjs

      - name: Silent-write guard
        run: node scripts/check-silent-writes.mjs

      - name: Ruleset/workflow consistency guard (US-213)
        run: node scripts/check-ruleset-consistency.mjs

      - name: CSP inline-script hash guard (US-202)
        run: node scripts/check-csp-hashes.mjs

      - name: Rate-limit coverage guard (US-243)
        run: node scripts/check-rate-limit-coverage.mjs

      - name: Sanitizer test-env guard (US-304)
        run: node scripts/check-sanitizer-test-env.mjs

      - name: Unreferenced security-module guard (US-302)
        run: node scripts/check-unreferenced-security-modules.mjs

      - name: Insecure-random guard (US-296)
        run: node scripts/check-insecure-random.mjs

      - name: Unauthenticated edge-function guard (US-241)
        run: node scripts/check-unauthenticated-edge-functions.mjs

      - name: Migration filename guard (US-235)
        run: bash scripts/check-migration-filenames.sh

      - name: No stray edge-function backup copies (US-239)
        run: bash scripts/check-no-stray-function-copies.sh

      - name: RLS permissive-policy guard (US-237)
        run: node scripts/check-rls-policies.mjs

      - name: No tracked build/backup/env cruft (US-261)
        run: bash scripts/check-no-tracked-cruft.sh

      - name: Migration backward-compat guard (US-250)
        run: node scripts/check-migration-backcompat.mjs

      - name: Index CONCURRENTLY guard (US-249)
        run: node scripts/check-index-concurrently.mjs
