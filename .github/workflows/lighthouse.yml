name: Lighthouse CI

# Performance budget for the public marketing routes (US-257). Budgets and the
# route list live in lighthouserc.cjs; the numbers behind them are in
# docs/LIGHTHOUSE_BUDGET.md. A failing assertion fails this check on the PR.

on:
  push:
    branches: [main, develop]
  pull_request:
    # Feature and fix PRs target develop, so that is where a regression has to
    # be caught; main and release/** cover release and hotfix PRs.
    branches: [main, develop, 'release/**']

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    env:
      # Job-level so `vite build` and `vite preview` (started by LHCI) load the
      # same config; vite.config.ts refuses to start without both. The URL is
      # deliberately unresolvable: the audit measures the page, and must never
      # send traffic to the production Supabase project. The committed budgets
      # were measured with these same values.
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: lighthouse-audit-placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      # The prerender step (scripts/prerender.mjs) renders the marketing routes
      # with Playwright's Chromium. Without it the build ships the empty SPA
      # shell and the audit would measure a page users never get.
      - name: Install Chromium for the prerender
        run: npx playwright install chromium --with-deps

      - name: Build (with prerender)
        # build:prerender = npm run build, then fail unless / and /pricing
        # were actually prerendered.
        run: npm run build:prerender
        env:
          PRERENDER_STRICT: '1'

      # @lhci/cli is a devDependency, so the version is pinned by the lockfile.
      # LHCI starts `vite preview` itself (collect.startServerCommand).
      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
