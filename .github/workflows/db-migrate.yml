name: Database Migrations

# US-248: the auditable path for getting migrations into a Supabase project.
#
# Before this existed, migrations reached production by running `supabase db
# push` and `supabase migration repair` from a laptop. The repo history still
# carries the evidence: a repair script listing ~100 remote-only migrations to
# mark reverted, and a 354-line mark-applied.ps1 marking ~180 as applied by
# hand. Nothing recorded who ran what, against which project, or when.
#
# Every run here leaves a log: which migrations were pending, which project
# they went to, and who approved it. `drift` reports without changing anything
# and is safe to run at any time.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN      -- CLI auth, one per organisation
#   SUPABASE_STAGING_DB_URL    -- staging Postgres connection string (US-247)
#   SUPABASE_PROD_DB_URL       -- production Postgres connection string
#
# Production applies run in the `production-database` GitHub Environment. Add a
# required reviewer to that environment so a human approves each apply; the job
# blocks until they do. See docs/RUNBOOK_MIGRATIONS.md.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which project to apply to
        required: true
        default: staging
        type: choice
        options: [staging, production]
      dry_run:
        description: Report pending migrations without applying them
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrate.yml'
  schedule:
    # Drift report every weekday morning, so divergence surfaces on its own
    # rather than at the moment someone needs to ship.
    - cron: '17 13 * * 1-5'

concurrency:
  # Never let two applies race against the same project.
  group: db-migrate-${{ github.event.inputs.target || 'drift' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integrity:
    name: History integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The append-only check diffs against the base branch.
          fetch-depth: 0
      - name: Migration filenames (US-235)
        run: bash scripts/check-migration-filenames.sh
      - name: Append-only history (US-248)
        run: node scripts/check-migration-drift.mjs
        env:
          MIGRATION_BASE_REF: origin/${{ github.base_ref || 'main' }}

  drift:
    name: Remote drift report
    runs-on: ubuntu-latest
    needs: integrity
    strategy:
      fail-fast: false
      matrix:
        project: [staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve connection string
        id: db
        env:
          STAGING_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          PROD_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          if [ "${{ matrix.project }}" = "staging" ]; then URL="$STAGING_URL"; else URL="$PROD_URL"; fi
          if [ -z "$URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::add-mask::$URL"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Not configured
        if: steps.db.outputs.configured != 'true'
        run: |
          echo "::notice::No connection string for ${{ matrix.project }}; skipping the drift report."
          echo "Set SUPABASE_STAGING_DB_URL / SUPABASE_PROD_DB_URL to enable it." >> "$GITHUB_STEP_SUMMARY"

      - name: Compare local migrations against the remote history
        if: steps.db.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          supabase migration list --db-url "${{ steps.db.outputs.url }}" | tee /tmp/list.txt
          {
            echo "### ${{ matrix.project }} migration state"
            echo
            echo '```'
            cat /tmp/list.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A row with a remote version and no local file is real divergence:
          # something ran against the database that this repo cannot reproduce.
          if awk -F'|' 'NR>2 && $2 ~ /[0-9]/ && $1 !~ /[0-9]/ {found=1} END {exit !found}' /tmp/list.txt; then
            echo "::error::${{ matrix.project }} has migrations with no local file. Do not apply; see docs/RUNBOOK_MIGRATIONS.md."
            exit 1
          fi

  apply:
    name: Apply to ${{ github.event.inputs.target }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [integrity, drift]
    # Production gets a protected environment so an apply needs human approval.
    environment: ${{ github.event.inputs.target == 'production' && 'production-database' || 'staging-database' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Refuse to apply to production without a green staging run
        if: github.event.inputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Staging is where migrations get tested (US-247). Applying to
          # production without one having succeeded on this commit is exactly
          # the laptop-push habit this workflow replaces.
          runs=$(gh api "repos/${{ github.repository }}/actions/workflows/db-migrate.yml/runs?head_sha=${{ github.sha }}&status=success" \
                 --jq '[.workflow_runs[] | select(.name != null)] | length')
          if [ "${runs:-0}" -eq 0 ]; then
            echo "::error::No successful db-migrate run for commit ${{ github.sha }}. Apply to staging first."
            exit 1
          fi

      - name: Resolve connection string
        id: db
        env:
          STAGING_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
          PROD_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          if [ "${{ github.event.inputs.target }}" = "staging" ]; then URL="$STAGING_URL"; else URL="$PROD_URL"; fi
          if [ -z "$URL" ]; then
            echo "::error::No connection string configured for ${{ github.event.inputs.target }}."
            exit 1
          fi
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase migration list --db-url "${{ steps.db.outputs.url }}" | tee /tmp/pending.txt
          {
            echo "### Pending on ${{ github.event.inputs.target }}"
            echo
            echo '```'
            cat /tmp/pending.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::Dry run -- nothing applied. Re-run with dry_run: false to apply."

      - name: Apply
        if: github.event.inputs.dry_run != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --db-url "${{ steps.db.outputs.url }}" --include-all

      - name: Confirm the remote history matches
        if: github.event.inputs.dry_run != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase migration list --db-url "${{ steps.db.outputs.url }}" | tee /tmp/after.txt
          {
            echo "### After apply -- ${{ github.event.inputs.target }}"
            echo
            echo '```'
            cat /tmp/after.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -F'|' 'NR>2 && $1 ~ /[0-9]/ && $2 !~ /[0-9]/ {found=1} END {exit !found}' /tmp/after.txt; then
            echo "::error::Migrations are still pending after the push."
            exit 1
          fi
