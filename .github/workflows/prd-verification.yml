name: PRD Verification

# Verification gate for PRD stories whose acceptance criteria require a real
# install/build/typecheck/test run (e.g. "npm run build completes successfully",
# "tsc passes"). These cannot be confirmed in a sandbox without node_modules, so
# completion of those criteria is delegated to this GitHub Action.
#
# Runs automatically on the PRD verification branches and on demand.

on:
  push:
    branches:
      - 'claude/**'
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check (US-212 error-budget ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      # US-258: ratchet on .github/ts-error-baseline.txt instead of requiring a
      # fully-green tsc (red on every push until US-212 completes).
      - run: node scripts/check-ts-error-budget.mjs

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - run: npm run test:run

  build:
    name: Build (npm run build acceptance gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          # vite.config.ts refuses to build without these (the deploy guard).
          # This gate checks that the build completes, not that it can reach
          # a backend; same placeholders ci.yml's Build job uses.
          VITE_SUPABASE_URL: https://ci.placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key
      - uses: actions/upload-artifact@v4
        with:
          name: prd-verification-build
          path: dist/
          retention-days: 7
