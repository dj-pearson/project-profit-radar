name: Uptime Health Check

# US-208 / US-280: external synthetic monitor for the health-check edge
# function. The function returns HTTP 200 only when DB, auth and storage are all
# healthy and 503 otherwise. scripts/uptime-monitor.mjs probes it (3 attempts,
# 15s apart, 20s timeout each), compares the result with the state saved by the
# previous run, and posts to Slack only on a change: FAILING when it goes down,
# a reminder every 6h while it stays down, RECOVERED when it comes back.
#
# State is carried between runs in the Actions cache (key prefix
# uptime-state-). If the cache is evicted the next down result alerts again,
# which errs on the side of paging. See docs/RUNBOOK_MONITORING.md.
#
# Not a required status check: it runs on schedule/dispatch only, never on a
# pull request, so it is absent from .github/rulesets on purpose.

on:
  schedule:
    # Roughly every 10 minutes, off the :00 mark to avoid fleet-wide pileups.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Send a [SIMULATED] alert to test routing end-to-end (saved state is untouched)'
        type: boolean
        default: false

# Queue rather than cancel: a cancelled run would drop its state save.
concurrency:
  group: uptime-health-check
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # save the state cache

jobs:
  ping:
    name: Ping health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Configure these in repo settings to enable monitoring/alerting
      # (Settings > Secrets and variables > Actions):
      #   - HEALTH_CHECK_URL       variable (or secret) - the deployed function URL
      #   - HEALTH_CHECK_ANON_KEY  secret - the project's anon key, sent as apikey
      #                            and Bearer (the function keeps verify_jwt on)
      #   - SLACK_WEBHOOK_URL      secret, optional - the on-call Slack channel
      HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL || secrets.HEALTH_CHECK_URL }}
      HEALTH_CHECK_ANON_KEY: ${{ secrets.HEALTH_CHECK_ANON_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SIMULATE_FAILURE: ${{ inputs.simulate_failure == true && 'true' || 'false' }}
      STATE_FILE: .uptime-state/state.json
      REMIND_AFTER_MINUTES: '360'
    steps:
      - name: Skip notice when unconfigured
        if: env.HEALTH_CHECK_URL == '' && env.SIMULATE_FAILURE != 'true'
        run: echo "::notice::HEALTH_CHECK_URL is not set - uptime monitoring is inert. See docs/RUNBOOK_MONITORING.md."

      - uses: actions/checkout@v4
        if: env.HEALTH_CHECK_URL != '' || env.SIMULATE_FAILURE == 'true'
        with:
          sparse-checkout: |
            scripts/uptime-monitor.mjs
            .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        if: env.HEALTH_CHECK_URL != '' || env.SIMULATE_FAILURE == 'true'
        with:
          node-version-file: '.nvmrc'

      - name: Restore last state
        id: restore
        if: env.HEALTH_CHECK_URL != '' || env.SIMULATE_FAILURE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: uptime-state-

      - name: Probe and alert
        id: monitor
        if: env.HEALTH_CHECK_URL != '' || env.SIMULATE_FAILURE == 'true'
        timeout-minutes: 3
        run: node scripts/uptime-monitor.mjs

      - name: Save state
        if: always() && steps.monitor.outputs.persist == 'true'
        uses: actions/cache/save@v4
        with:
          path: .uptime-state
          key: uptime-state-${{ github.run_id }}-${{ github.run_attempt }}

      # One entry is enough; drop the one this run started from so the cache
      # does not collect ~144 entries a day.
      - name: Prune previous state entry
        if: always() && steps.monitor.outputs.persist == 'true' && steps.restore.outputs.cache-matched-key != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: gh cache delete "$OLD_KEY" --repo "$GITHUB_REPOSITORY"

      - name: Fail the run on a new or reminded outage (emails repo admins)
        if: steps.monitor.outputs.fail_run == 'true'
        run: |
          echo "Health check alert (${{ steps.monitor.outputs.action }}). See the Probe and alert step."
          exit 1
